[project]
name = "coverage-map"
version = "1.0.0"
description = "ТЗ 7 «Карта покрытия»: очистка замеров RSRP, сетка 200 м, выбор площадок для БС"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web/static/vendor"]

[tool.ruff.format]
# документация (README, ТЗ) не форматируется ruff: примеры в ней показывают допущения, а не код проекта
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — намеренно
  "B008",                         # File(...)/Form(...) в сигнатурах FastAPI — штатный приём
  "B905",                         # zip() по столбцам одного DataFrame — длины равны по построению
  "E501",                         # длину строк контролирует ruff format
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*httpx2.*"]
