name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for provider keys
        run: "! git grep -qE '[g]sk_[A-Za-z0-9]{20,}'"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: CLI на открытом наборе = expected.json
        run: |
          python run.py --out out
          python -c "import json; a=json.load(open('out/result.json')); b=json.load(open('data/expected.json')); assert a==b, (a, b); print('result.json == expected.json')"
      - name: Self-check на грязных данных
        run: python scripts/make_dirty_dataset.py
